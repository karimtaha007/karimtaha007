<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="Certificates - Kareem Taha" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF7E8"/>
      <stop offset="45%" stop-color="#F5E7C6"/>
      <stop offset="100%" stop-color="#E9D5A6"/>
    </linearGradient>
    <linearGradient id="rollv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B98F45"/>
      <stop offset="35%" stop-color="#E3C583"/>
      <stop offset="65%" stop-color="#CFA95E"/>
      <stop offset="100%" stop-color="#A97F3B"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A24D" stop-opacity="0.45"/>
      <stop offset="12%" stop-color="#C9A24D" stop-opacity="0"/>
      <stop offset="88%" stop-color="#C9A24D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C9A24D" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- parchment sheet -->
  <rect x="52" y="18" width="716" height="194" fill="url(#sheet)"/>
  <rect x="52" y="18" width="716" height="194" fill="url(#shade)"/>

  <!-- faint texture rules -->
  <g stroke="#C9A24D" stroke-width="1" opacity="0.13">
    <line x1="70" y1="46" x2="750" y2="46"/>
    <line x1="70" y1="186" x2="750" y2="186"/>
  </g>

  <!-- inner border -->
  <rect x="76" y="38" width="668" height="154" fill="none" stroke="#C9A24D" stroke-width="1.6" opacity="0.75"/>
  <rect x="84" y="46" width="652" height="138" fill="none" stroke="#D8BC85" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- corner flourishes -->
  <g stroke="#B98F45" stroke-width="2" fill="none" opacity="0.8">
    <path d="M76 62 V38 H100"/>
    <path d="M720 38 H744 V62"/>
    <path d="M76 168 V192 H100"/>
    <path d="M720 192 H744 V168"/>
  </g>

  <!-- title -->
  <text x="410" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#4E3620" letter-spacing="7">CERTIFICATES</text>

  <line x1="270" y1="120" x2="550" y2="120" stroke="#B98F45" stroke-width="1.6"/>
  <circle cx="410" cy="120" r="4.5" fill="#B03A2E"/>

  <text x="410" y="148" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#6B5227" letter-spacing="2">Kareem Taha</text>
  <text x="410" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#8A6B35" letter-spacing="1.4">Electrical Engineering  ·  Ramallah, Palestine</text>

  <!-- left roll -->
  <rect x="20" y="6" width="34" height="218" rx="17" fill="url(#rollv)" stroke="#96702F" stroke-width="2"/>
  <rect x="31" y="22" width="4" height="186" rx="2" fill="#F6E4B8" opacity="0.6"/>
  <ellipse cx="37" cy="15" rx="17" ry="9" fill="#E3C583" stroke="#96702F" stroke-width="1.8"/>
  <ellipse cx="37" cy="215" rx="17" ry="9" fill="#E3C583" stroke="#96702F" stroke-width="1.8"/>

  <!-- right roll -->
  <rect x="766" y="6" width="34" height="218" rx="17" fill="url(#rollv)" stroke="#96702F" stroke-width="2"/>
  <rect x="777" y="22" width="4" height="186" rx="2" fill="#F6E4B8" opacity="0.6"/>
  <ellipse cx="783" cy="15" rx="17" ry="9" fill="#E3C583" stroke="#96702F" stroke-width="1.8"/>
  <ellipse cx="783" cy="215" rx="17" ry="9" fill="#E3C583" stroke="#96702F" stroke-width="1.8"/>
</svg>
