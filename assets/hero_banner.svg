<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3949ab"/>
      <stop offset="45%" stop-color="#5c6bc0"/>
      <stop offset="75%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect width="900" height="240" rx="18" fill="url(#grid)"/>

  <!-- circuit trace lines -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M40 60 H140 V100 H220"/>
    <path d="M40 180 H120 V140 H200"/>
    <path d="M860 60 H760 V100 H700"/>
    <path d="M860 190 H780 V150 H700"/>
    <circle cx="220" cy="100" r="4" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="200" cy="140" r="4" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="700" cy="100" r="4" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="700" cy="150" r="4" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- left icon: IC chip -->
  <g transform="translate(70,95)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2"/>
    <rect x="14" y="14" width="22" height="22" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    <g stroke="#ffffff" stroke-width="2">
      <line x1="-8" y1="10" x2="0" y2="10"/>
      <line x1="-8" y1="25" x2="0" y2="25"/>
      <line x1="-8" y1="40" x2="0" y2="40"/>
      <line x1="50" y1="10" x2="58" y2="10"/>
      <line x1="50" y1="25" x2="58" y2="25"/>
      <line x1="50" y1="40" x2="58" y2="40"/>
    </g>
  </g>

  <!-- right icon: lightning bolt (power) -->
  <g transform="translate(770,90)">
    <polygon points="30,0 8,34 24,34 14,60 46,24 28,24" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- center text -->
  <text x="450" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Kareem Taha</text>
  <text x="450" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.9">IC Design · PCB Engineering · Power Systems · Automation</text>

  <!-- bottom flag / location -->
  <text x="450" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.75">⚡ Electrical Engineer · Ramallah, Palestine 🇵🇸</text>
</svg>
