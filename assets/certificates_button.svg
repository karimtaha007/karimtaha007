<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="View My Certificates" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF1DA"/>
      <stop offset="55%" stop-color="#F2E1BC"/>
      <stop offset="100%" stop-color="#E7D2A4"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3C583"/>
      <stop offset="50%" stop-color="#CFA95E"/>
      <stop offset="100%" stop-color="#B98F45"/>
    </linearGradient>
    <linearGradient id="scrollBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6E6"/>
      <stop offset="100%" stop-color="#EFDCB4"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="512" height="132" rx="16" fill="url(#parch)" stroke="#C9A24D" stroke-width="2.5"/>
  <rect x="12" y="12" width="496" height="116" rx="11" fill="none" stroke="#D8BC85" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.85"/>

  <!-- ===== scroll icon ===== -->
  <g transform="translate(44,26)">
    <!-- body -->
    <rect x="9" y="10" width="62" height="68" rx="4" fill="url(#scrollBody)" stroke="#B98F45" stroke-width="2.4"/>
    <!-- ruled lines -->
    <g fill="#8A6B35" opacity="0.55">
      <rect x="19" y="24" width="42" height="3.4" rx="1.7"/>
      <rect x="19" y="34" width="42" height="3.4" rx="1.7"/>
      <rect x="19" y="44" width="30" height="3.4" rx="1.7"/>
      <rect x="44" y="54" width="17" height="3.4" rx="1.7"/>
    </g>
    <!-- seal -->
    <circle cx="30" cy="63" r="9" fill="#B03A2E" stroke="#8C2D24" stroke-width="1.6"/>
    <path d="M25.5 63.2 L28.8 66.4 L34.6 59.8" fill="none" stroke="#FBF1DA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- top roll -->
    <rect x="0" y="0" width="80" height="16" rx="8" fill="url(#roll)" stroke="#A97F3B" stroke-width="2"/>
    <rect x="10" y="5.5" width="60" height="2.6" rx="1.3" fill="#F6E4B8" opacity="0.75"/>
    <!-- bottom roll -->
    <rect x="0" y="72" width="80" height="16" rx="8" fill="url(#roll)" stroke="#A97F3B" stroke-width="2"/>
    <rect x="10" y="77.5" width="60" height="2.6" rx="1.3" fill="#F6E4B8" opacity="0.75"/>
  </g>

  <!-- divider -->
  <line x1="150" y1="34" x2="150" y2="106" stroke="#D8BC85" stroke-width="1.6"/>

  <!-- ===== text ===== -->
  <text x="176" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="25.5" font-weight="bold" fill="#4E3620" letter-spacing="0.6">View My Certificates</text>
  <text x="176" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#7A6134">4 verified credentials</text>
  <text x="176" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#96793F">KNX  ·  uWave Semiconductor  ·  Coursera</text>

  <!-- chevron -->
  <g transform="translate(474,70)">
    <circle cx="0" cy="0" r="17" fill="#B98F45" opacity="0.16"/>
    <path d="M-4 -8 L5 0 L-4 8" fill="none" stroke="#8A6B35" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
